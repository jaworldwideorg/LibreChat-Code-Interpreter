name: Publish tested AWS release
on:
  push:
    tags: ['ja-*']
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/aws-release.yml']
permissions:
  contents: read
concurrency:
  group: aws-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Verify source contracts
        working-directory: service
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server jq
          bun install --frozen-lockfile
          bunx tsc --noEmit -p tsconfig.esm.json
          bun test ./src/*.test.ts ./src/*.spec.ts ./src/**/*.test.ts ./src/**/*.spec.ts
          bun run test:ptc
          sudo service redis-server start
          PUBLIC_WEB_TEST_REDIS_PORT=6379 bun test tests/public-web.test.ts
  publish:
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::467816190573:role/github-code-images
          aws-region: eu-central-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build coordinated release components
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^ja-[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]
          registry=467816190573.dkr.ecr.eu-central-1.amazonaws.com
          for component in api worker file-server tool-call-server egress-gateway public-egress-relay; do
            dockerfile=service/Dockerfile.$component
            if [ "$component" = file-server ]; then dockerfile=service/Dockerfile; fi
            image="$registry/oneja/codeapi/$component:$RELEASE_VERSION"
            docker build --platform linux/amd64 --target production -f "$dockerfile" --label org.opencontainers.image.version="$RELEASE_VERSION" --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$image" .
            docker push "$image"
          done
          printf '{"version":"%s","revision":"%s","components":["api","worker","file-server","tool-call-server","egress-gateway","public-egress-relay"]}\n' "$RELEASE_VERSION" "$GITHUB_SHA" > release.json
      - uses: actions/upload-artifact@v7
        with:
          name: aws-release
          path: release.json
